<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoachSquad PWA - Gestión de Equipos y Minutajes</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CoachSquad">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/53/53283.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pitch: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Alpine JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FIREBASE SDKs (Modular ESM) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged,
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            collection, 
            onSnapshot, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración real de tu proyecto de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDFjM15xA5PxxwCUSIRNjegKN7PPfL8hcc",
            authDomain: "gestion-de-equipos-d2839.firebaseapp.com",
            projectId: "gestion-de-equipos-d2839",
            storageBucket: "gestion-de-equipos-d2839.firebasestorage.app",
            messagingSenderId: "681431108301",
            appId: "1:681431108301:web:15307130648999e140b784",
            measurementId: "G-F9NWD497XN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Exportar referencias globalmente para el componente Alpine
        window.FB = {
            auth,
            db,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged,
            signInAnonymously,
            doc,
            getDoc,
            setDoc,
            collection,
            onSnapshot,
            addDoc,
            updateDoc,
            deleteDoc,
            getDocs
        };
    </script>

    <style>
        [x-cloak] { display: none !important; }
        input, select, textarea, button { touch-action: manipulation; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-card { border: 1px solid #cbd5e1 !important; background: white !important; color: black !important; box-shadow: none !important; }
            input, select, textarea { border: none !important; background: transparent !important; color: black !important; }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-24 lg:pb-8 flex flex-col selection:bg-pitch-500 selection:text-white" x-data="pwaApp()" x-init="initApp()">

    <!-- AUTH MODAL / LOGIN SCREEN (When not logged in) -->
    <div x-show="!currentUser && !authLoading" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-gradient-to-tr from-pitch-600 to-emerald-400 rounded-2xl flex items-center justify-center text-white mx-auto shadow-lg shadow-pitch-600/30">
                    <i class="fa-solid fa-users-gear text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-white">CoachSquad</h2>
                <p class="text-xs text-slate-400">Inicia sesión para gestionar tus propios equipos y guardar tus datos en la nube.</p>
            </div>

            <!-- Formularios Auth -->
            <div class="space-y-4">
                <div class="flex border-b border-slate-800 text-xs font-bold text-slate-400">
                    <button @click="authMode = 'login'" :class="authMode === 'login' ? 'text-pitch-400 border-b-2 border-pitch-500 pb-2' : 'pb-2'" class="flex-1 text-center">Iniciar Sesión</button>
                    <button @click="authMode = 'register'" :class="authMode === 'register' ? 'text-pitch-400 border-b-2 border-pitch-500 pb-2' : 'pb-2'" class="flex-1 text-center">Registrarse</button>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400">Correo Electrónico</label>
                        <input type="email" x-model="authForm.email" placeholder="entrenador@ejemplo.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pitch-500 mt-1">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400">Contraseña</label>
                        <input type="password" x-model="authForm.password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pitch-500 mt-1">
                    </div>

                    <button @click="handleEmailAuth()" class="w-full py-3 bg-pitch-600 hover:bg-pitch-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-pitch-600/30 transition active:scale-95">
                        <span x-text="authMode === 'login' ? 'Entrar a Mi Cuenta' : 'Crear Nueva Cuenta'"></span>
                    </button>

                    <div class="relative py-2 flex items-center justify-center">
                        <div class="border-t border-slate-800 w-full"></div>
                        <span class="bg-slate-900 px-2 text-[10px] text-slate-500 uppercase font-bold absolute">o</span>
                    </div>

                    <button @click="handleGoogleAuth()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs border border-slate-700 transition flex items-center justify-center gap-2 active:scale-95">
                        <i class="fa-brands fa-google text-red-400"></i>
                        <span>Continuar con Google</span>
                    </button>

                    <button @click="handleAnonymousAuth()" class="w-full py-2 text-slate-400 hover:text-slate-200 text-[11px] font-semibold text-center transition">
                        Continuar como invitado (Temporal)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CARGANDO AUTH -->
    <div x-show="authLoading" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center" x-cloak>
        <div class="text-center space-y-3">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-pitch-500"></i>
            <p class="text-xs font-bold text-slate-400">Cargando tus datos y equipos...</p>
        </div>
    </div>

    <!-- HEADER / APP BAR -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-40 no-print" x-show="currentUser" x-cloak>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-pitch-600 to-emerald-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-pitch-600/30">
                    <i class="fa-solid fa-users-gear text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-base sm:text-lg font-black tracking-tight text-white leading-tight">CoachSquad</h1>
                        <span class="text-[10px] font-bold bg-pitch-500/20 text-pitch-400 px-2 py-0.5 rounded-full border border-pitch-500/30">PWA</span>
                    </div>
                    <!-- Dropdown selector rápido de equipo -->
                    <div class="flex items-center gap-1.5">
                        <span class="text-[11px] text-slate-400">Equipo:</span>
                        <select x-model="currentTeamId" @change="saveAllDataToCloud()" class="bg-transparent text-[11px] font-bold text-pitch-400 border-none focus:ring-0 cursor-pointer p-0 m-0">
                            <template x-for="t in teams" :key="t.id">
                                <option :value="t.id" x-text="t.name" class="bg-slate-900 text-slate-200"></option>
                            </template>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Botones de Acción Global & Perfil -->
            <div class="flex items-center gap-2">
                <div x-show="currentUser" class="flex items-center gap-2 pl-2 border-l border-slate-800">
                    <div class="text-right hidden md:block">
                        <div class="text-xs font-bold text-white" x-text="currentUser?.email || 'Usuario Local'"></div>
                        <span class="text-[9px] text-pitch-400 font-bold uppercase">Sincronizado</span>
                    </div>
                    <button @click="logout()" class="p-2 bg-slate-800 hover:bg-rose-500/20 text-slate-300 hover:text-rose-400 rounded-xl border border-slate-700 transition" title="Cerrar Sesión">
                        <i class="fa-solid fa-right-from-bracket text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- NOTIFICACIÓN TOAST -->
    <div x-show="toast.show" x-transition x-cloak class="fixed bottom-20 lg:bottom-6 right-4 left-4 sm:left-auto z-50 px-4 py-3 rounded-xl shadow-2xl border flex items-center gap-3 backdrop-blur-md"
         :class="toast.type === 'success' ? 'bg-slate-900/95 border-pitch-500/50 text-pitch-400' : 'bg-slate-900/95 border-rose-500/50 text-rose-400'">
        <i :class="toast.type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'" class="fa-solid text-lg"></i>
        <span class="text-xs sm:text-sm font-semibold" x-text="toast.message"></span>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 flex-1 w-full space-y-6" x-show="currentUser" x-cloak>

        <!-- NAVEGACIÓN DESKTOP (TABS) -->
        <div class="hidden lg:flex border-b border-slate-800/80 space-x-2 no-print">
            <button @click="currentView = 'match'" :class="currentView === 'match' ? 'border-pitch-500 text-pitch-400 bg-slate-900/60' : 'border-transparent text-slate-400 hover:text-slate-200'" class="px-4 py-2.5 font-bold text-xs rounded-t-xl border-b-2 transition flex items-center gap-2">
                <i class="fa-solid fa-stopwatch text-sm"></i> Gestor de Partido y Minutajes
            </button>
            <button @click="currentView = 'roster'" :class="currentView === 'roster' ? 'border-pitch-500 text-pitch-400 bg-slate-900/60' : 'border-transparent text-slate-400 hover:text-slate-200'" class="px-4 py-2.5 font-bold text-xs rounded-t-xl border-b-2 transition flex items-center gap-2">
                <i class="fa-solid fa-users text-sm"></i> Plantilla y Equipos
            </button>
            <button @click="currentView = 'player-card'" :class="currentView === 'player-card' ? 'border-pitch-500 text-pitch-400 bg-slate-900/60' : 'border-transparent text-slate-400 hover:text-slate-200'" class="px-4 py-2.5 font-bold text-xs rounded-t-xl border-b-2 transition flex items-center gap-2">
                <i class="fa-solid fa-user-gear text-sm"></i> Ficha Individual del Jugador
            </button>
            <button @click="currentView = 'settings'" :class="currentView === 'settings' ? 'border-pitch-500 text-pitch-400 bg-slate-900/60' : 'border-transparent text-slate-400 hover:text-slate-200'" class="px-4 py-2.5 font-bold text-xs rounded-t-xl border-b-2 transition flex items-center gap-2">
                <i class="fa-solid fa-sliders text-sm"></i> Ajustes / PWA
            </button>
        </div>

        <!-- ================= VISTA 1: GESTOR DE PARTIDO Y MINUTAJES ================= -->
        <section x-show="currentView === 'match'" class="space-y-6">
            
            <!-- PANEL CONTROL CRONÓMETRO Y ESTADO DEL PARTIDO -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-pitch-600/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="flex flex-col lg:flex-row justify-between items-center gap-6">
                    <div class="w-full lg:w-1/3 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-pitch-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-shield-halved"></i> Partido Actual
                            </span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md"
                                  :class="match.status === 'live' ? 'bg-rose-500/20 text-rose-400 animate-pulse border border-rose-500/30' : 'bg-slate-800 text-slate-400'">
                                <i class="fa-solid fa-circle text-[8px] mr-1"></i>
                                <span x-text="match.status === 'live' ? 'EN JUEGO' : (match.status === 'paused' ? 'PAUSADO' : 'FINALIZADO / CONFIG')"></span>
                            </span>
                        </div>
                        <input type="text" x-model="match.opponent" placeholder="Nombre del Rival (Ej: CF Madrid)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold text-white focus:outline-none focus:border-pitch-500">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400">Duración Parte (min)</label>
                                <input type="number" x-model.number="match.halfDuration" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400">Periodo Actual</label>
                                <select x-model="match.period" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200">
                                    <option value="1">1ª Parte</option>
                                    <option value="2">2ª Parte</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Display del Reloj / Cronómetro -->
                    <div class="flex flex-col items-center justify-center bg-slate-950 border border-slate-800 rounded-2xl px-8 py-4 w-full lg:w-1/3 shadow-inner">
                        <div class="text-4xl sm:text-5xl font-black font-mono tracking-tight text-pitch-400" x-text="formatTime(match.seconds)">00:00</div>
                        <div class="text-[11px] text-slate-400 mt-1 font-semibold">
                            Minuto Oficial: <span class="text-white font-bold" x-text="currentMatchMinute + '\''">0'</span>
                        </div>
                    </div>

                    <!-- Botones de Control -->
                    <div class="w-full lg:w-1/3 flex flex-col gap-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button @click="toggleTimer()" class="py-3 px-4 font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition active:scale-95 shadow-md"
                                    :class="match.timerRunning ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-pitch-600 hover:bg-pitch-500 text-white'">
                                <i class="fa-solid" :class="match.timerRunning ? 'fa-pause' : 'fa-play'"></i>
                                <span x-text="match.timerRunning ? 'PAUSAR' : 'INICIAR'"></span>
                            </button>

                            <button @click="resetTimerPrompt()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition border border-slate-700 active:scale-95">
                                <i class="fa-solid fa-rotate-left"></i>
                                <span>RESETEAR</span>
                            </button>
                        </div>

                        <button @click="saveMatchAndSyncPlayers()" class="py-3 px-4 bg-gradient-to-r from-emerald-600 to-pitch-600 hover:from-emerald-500 hover:to-pitch-500 text-white font-extrabold rounded-xl text-xs shadow-lg shadow-pitch-600/30 flex items-center justify-center gap-2 transition active:scale-95 border border-pitch-400/30">
                            <i class="fa-solid fa-cloud-arrow-up text-base"></i>
                            <span>GUARDAR PARTIDO Y ACTUALIZAR FICHAS</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- REGISTRO Y SELECCIÓN DE ALINEACIÓN -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                <!-- EN CAMPO -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                            <h3 class="font-bold text-white text-sm">En Campo (<span x-text="playersOnField.length"></span>)</h3>
                        </div>
                        <span class="text-[10px] text-slate-400 font-semibold">Jugando actualmente</span>
                    </div>

                    <div class="space-y-2 max-h-[420px] overflow-y-auto pr-1">
                        <template x-for="p in playersOnField" :key="p.id">
                            <div class="bg-slate-950 border border-slate-800 hover:border-slate-700 rounded-xl p-3 flex items-center justify-between transition">
                                <div class="flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-black flex items-center justify-center text-xs" x-text="p.number || '#'"></span>
                                    <div>
                                        <div class="text-xs font-bold text-white" x-text="p.name"></div>
                                        <div class="text-[10px] text-slate-400">
                                            <span x-text="p.matchRole === 'Titular' ? 'Titular' : 'Sustituto'"></span> • 
                                            Min. Entrada: <span class="text-emerald-400 font-bold" x-text="p.entryMinute + '\''"></span>
                                        </div>
                                    </div>
                                </div>

                                <button @click="substituteOut(p)" class="px-2.5 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-[11px] font-bold transition flex items-center gap-1 active:scale-95">
                                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                    <span>Sustituir</span>
                                </button>
                            </div>
                        </template>
                        <template x-if="playersOnField.length === 0">
                            <div class="text-center py-8 text-slate-500 text-xs">No hay jugadores en el campo. Selecciona titulares abajo.</div>
                        </template>
                    </div>
                </div>

                <!-- BANQUILLO -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                            <h3 class="font-bold text-white text-sm">Banquillo / Disponibles (<span x-text="playersOnBench.length"></span>)</h3>
                        </div>
                        <span class="text-[10px] text-slate-400 font-semibold">Listos para entrar</span>
                    </div>

                    <div class="space-y-2 max-h-[420px] overflow-y-auto pr-1">
                        <template x-for="p in playersOnBench" :key="p.id">
                            <div class="bg-slate-950 border border-slate-800 hover:border-slate-700 rounded-xl p-3 flex items-center justify-between transition">
                                <div class="flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-400 font-black flex items-center justify-
