<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoachSquad PWA - Gestión de Equipos y Minutajes</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CoachSquad">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/53/53283.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pitch: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Alpine JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FIREBASE SDKs & CONFIGURACIÓN LIMPIA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged,
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            collection, 
            onSnapshot, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFjM15xA5PxxwCUSIRNjegKN7PPfL8hcc",
            authDomain: "gestion-de-equipos-d2839.firebaseapp.com",
            projectId: "gestion-de-equipos-d2839",
            storageBucket: "gestion-de-equipos-d2839.firebasestorage.app",
            messagingSenderId: "681431108301",
            appId: "1:681431108301:web:15307130648999e140b784",
            measurementId: "G-F9NWD497XN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FB = {
            auth,
            db,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged,
            signInAnonymously,
            doc,
            getDoc,
            setDoc,
            collection,
            onSnapshot,
            addDoc,
            updateDoc,
            deleteDoc,
            getDocs
        };
    </script>

    <style>
        [x-cloak] { display: none !important; }
        input, select, textarea, button { touch-action: manipulation; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-24 lg:pb-8 flex flex-col selection:bg-pitch-500 selection:text-white" x-data="pwaApp()" x-init="initApp()">

    <!-- AUTH MODAL / LOGIN SCREEN -->
    <div x-show="!currentUser && !authLoading" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-gradient-to-tr from-pitch-600 to-emerald-400 rounded-2xl flex items-center justify-center text-white mx-auto shadow-lg shadow-pitch-600/30">
                    <i class="fa-solid fa-users-gear text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-white">CoachSquad</h2>
                <p class="text-xs text-slate-400">Inicia sesión para gestionar tus propios equipos y guardar tus datos en la nube.</p>
            </div>

            <div class="space-y-4">
                <div class="flex border-b border-slate-800 text-xs font-bold text-slate-400">
                    <button @click="authMode = 'login'" :class="authMode === 'login' ? 'text-pitch-400 border-b-2 border-pitch-500 pb-2' : 'pb-2'" class="flex-1 text-center">Iniciar Sesión</button>
                    <button @click="authMode = 'register'" :class="authMode === 'register' ? 'text-pitch-400 border-b-2 border-pitch-500 pb-2' : 'pb-2'" class="flex-1 text-center">Registrarse</button>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400">Correo Electrónico</label>
                        <input type="email" x-model="authForm.email" placeholder="entrenador@ejemplo.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pitch-500 mt-1">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400">Contraseña</label>
                        <input type="password" x-model="authForm.password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pitch-500 mt-1">
                    </div>

                    <button @click="handleEmailAuth()" class="w-full py-3 bg-pitch-600 hover:bg-pitch-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-pitch-600/30 transition active:scale-95">
                        <span x-text="authMode === 'login' ? 'Entrar a Mi Cuenta' : 'Crear Nueva Cuenta'"></span>
                    </button>

                    <div class="relative py-2 flex items-center justify-center">
                        <div class="border-t border-slate-800 w-full"></div>
                        <span class="bg-slate-900 px-2 text-[10px] text-slate-500 uppercase font-bold absolute">o</span>
                    </div>

                    <button @click="handleGoogleAuth()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs border border-slate-700 transition flex items-center justify-center gap-2 active:scale-95">
                        <i class="fa-brands fa-google text-red-400"></i>
                        <span>Continuar con Google</span>
                    </button>

                    <button @click="handleAnonymousAuth()" class="w-full py-2 text-slate-400 hover:text-slate-200 text-[11px] font-semibold text-center transition">
                        Continuar como invitado (Temporal)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CARGANDO AUTH -->
    <div x-show="authLoading" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center" x-cloak>
        <div class="text-center space-y-3">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-pitch-500"></i>
            <p class="text-xs font-bold text-slate-400">Cargando tus datos y equipos...</p>
        </div>
    </div>

    <!-- HEADER / APP BAR -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-40 no-print" x-show="currentUser" x-cloak>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-pitch-600 to-emerald-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-pitch-600/30">
                    <i class="fa-solid fa-users-gear text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-base sm:text-lg font-black tracking-tight text-white leading-tight">CoachSquad</h1>
                        <span class="text-[10px] font-bold bg-pitch-500/20 text-pitch-400 px-2 py-0.5 rounded-full border border-pitch-500/30">PWA</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-[11px] text-slate-400">Equipo:</span>
                        <select x-model="currentTeamId" class="bg-transparent text-[11px] font-bold text-pitch-400 border-none focus:ring-0 cursor-pointer p-0 m-0">
                            <template x-for="t in teams" :key="t.id">
                                <option :value="t.id" x-text="t.name" class="bg-slate-900 text-slate-200"></option>
                            </template>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div class="flex items-center gap-2 pl-2 border-l border-slate-800">
                    <div class="text-right hidden md:block">
                        <div class="text-xs font-bold text-white" x-text="currentUser?.email || 'Usuario Invitado'"></div>
                        <span class="text-[9px] text-pitch-400 font-bold uppercase">Sincronizado</span>
                    </div>
                    <button @click="logout()" class="p-2 bg-slate-800 hover:bg-rose-500/20 text-slate-300 hover:text-rose-400 rounded-xl border border-slate-700 transition" title="Cerrar Sesión">
                        <i class="fa-solid fa-right-from-bracket text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- NOTIFICACIÓN TOAST -->
    <div x-show="toast.show" x-transition x-cloak class="fixed bottom-20 right-4 left-4 sm:left-auto z-50 px-4 py-3 rounded-xl shadow-2xl border flex items-center gap-3 backdrop-blur-md"
         :class="toast.type === 'success' ? 'bg-slate-900/95 border-pitch-500/50 text-pitch-400' : 'bg-slate-900/95 border-rose-500/50 text-rose-400'">
        <i :class="toast.type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'" class="fa-solid text-lg"></i>
        <span class="text-xs sm:text-sm font-semibold" x-text="toast.message"></span>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 flex-1 w-full space-y-6" x-show="currentUser" x-cloak>
        <div class="flex border-b border-slate-800/80 space-x-2 no-print">
            <button @click="currentView = 'match'" :class="currentView === 'match' ? 'border-pitch-500 text-pitch-400 bg-slate-900/60' : 'border-transparent text-slate-400 hover:text-slate-200'" class="px-4 py-2.5 font-bold text-xs rounded-t-xl border-b-2 transition flex items-center gap-2">
                <i class="fa-solid fa-stopwatch text-sm"></i> Partido
            </button>
            <button @click="currentView = 'roster'" :class="currentView === 'roster' ? 'border-pitch-500 text-pitch-400 bg-slate-900/60' : 'border-transparent text-slate-400 hover:text-slate-200'" class="px-4 py-2.5 font-bold text-xs rounded-t-xl border-b-2 transition flex items-center gap-2">
                <i class="fa-solid fa-users text-sm"></i> Plantilla
            </button>
        </div>

        <!-- VISTA PARTIDO -->
        <section x-show="currentView === 'match'" class="space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
                <h3 class="text-sm font-bold text-pitch-400">Gestor de Partido y Minutajes</h3>
                <div class="flex items-center gap-4">
                    <div class="text-3xl font-mono font-bold text-white" x-text="formatTime(match.seconds)">00:00</div>
                    <button @click="toggleTimer()" class="px-4 py-2 bg-pitch-600 hover:bg-pitch-500 text-white text-xs font-bold rounded-xl">
                        <span x-text="match.timerRunning ? 'Pausar' : 'Iniciar'"></span>
                    </button>
                    <button @click="resetTimerPrompt()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl">
                        Resetear
                    </button>
                </div>
            </div>
        </section>

        <!-- VISTA PLANTILLA -->
        <section x-show="currentView === 'roster'" class="space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-white">Equipos y Jugadores</h3>
                    <button @click="promptNewTeam()" class="px-3 py-1.5 bg-pitch-600 text-white text-xs font-bold rounded-xl">Nuevo Equipo</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <template x-for="t in teams" :key="t.id">
                        <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                            <span class="font-bold text-white text-xs" x-text="t.name"></span>
                            <button @click="currentTeamId = t.id" class="text-xs text-pitch-400 font-bold">Seleccionar</button>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </main>

    <!-- LOGICA ALPINE PWA -->
    <script>
        function pwaApp() {
            return {
                currentUser: null,
                authLoading: true,
                authMode: 'login',
                authForm: { email: '', password: '' },
                currentView: 'match',
                teams: [],
                currentTeamId: null,
                currentTeamPlayers: [],
                playersOnField: [],
                playersOnBench: [],
                match: { opponent: '', halfDuration: 45, period: 1, seconds: 0, timerRunning: false },
                matchPlayerStats: {},
                toast: { show: false, message: '', type: 'success' },

                initApp() {
                    window.FB.onAuthStateChanged(window.FB.auth, (user) => {
                        this.currentUser = user;
                        this.authLoading = false;
                        if (user) {
                            this.loadInitialData();
                        }
                    });
                },

                showToast(message, type = 'success') {
                    this.toast = { show: true, message, type };
                    setTimeout(() => { this.toast.show = false; }, 3000);
                },

                formatTime(seconds) {
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                },

                toggleTimer() {
                    this.match.timerRunning = !this.match.timerRunning;
                },

                resetTimerPrompt() {
                    this.match.seconds = 0;
                    this.match.timerRunning = false;
                },

                async handleEmailAuth() {
                    try {
                        this.authLoading = true;
                        if (this.authMode === 'login') {
                            await window.FB.signInWithEmailAndPassword(window.FB.auth, this.authForm.email, this.authForm.password);
                        } else {
                            await window.FB.createUserWithEmailAndPassword(window.FB.auth, this.authForm.email, this.authForm.password);
                        }
                        this.showToast("¡Sesión iniciada correctamente!");
                    } catch (error) {
                        this.showToast(error.message, 'error');
                        this.authLoading = false;
                    }
                },

                async handleGoogleAuth() {
                    try {
                        this.authLoading = true;
                        const provider = new window.FB.GoogleAuthProvider();
                        await window.FB.signInWithPopup(window.FB.auth, provider);
                        this.showToast("¡Autenticado con Google con éxito!");
                    } catch (error) {
                        this.showToast(error.message, 'error');
                        this.authLoading = false;
                    }
                },

                async handleAnonymousAuth() {
                    try {
                        this.authLoading = true;
                        await window.FB.signInAnonymously(window.FB.auth);
                        this.showToast("Acceso como invitado temporal concedido.");
                    } catch (error) {
                        this.showToast(error.message, 'error');
                        this.authLoading = false;
                    }
                },

                async logout() {
                    await window.FB.signOut(window.FB.auth);
                    this.currentUser = null;
                    this.teams = [];
                    this.showToast("Sesión cerrada.");
                },

                loadInitialData() {
                    this.teams = [
                        { id: 'team-1', name: 'Equipo Principal A' }
                    ];
                    this.currentTeamId = 'team-1';
                    this.currentTeamPlayers = [
                        { id: 'p1', number: '1', name: 'Portero Titular', position: 'POR' },
                        { id: 'p2', number: '4', name: 'Defensa Central', position: 'DEF' }
                    ];
                    this.playersOnField = [this.currentTeamPlayers[0]];
                    this.playersOnBench = [this.currentTeamPlayers[1]];
                },

                promptNewTeam() {
                    const name = prompt("Nombre del nuevo equipo:");
                    if (name) {
                        const newT = { id: 'team-' + Date.now(), name };
                        this.teams.push(newT);
                        this.currentTeamId = newT.id;
                        this.showToast("Equipo creado.");
                    }
                }
            }
        }
    </script>
</body>
</html>
